# Profile
profile: |
  Desarrollador Android Senior con más de 7 años de experiencia en aplicaciones móviles 
  y 18 años en ingeniería de software. Especializado en Kotlin, Jetpack Compose y Clean 
  Architecture, con un historial comprobado de entregar aplicaciones escalables y 
  altamente estables (98 % crash-free). Gran capacidad para colaborar en equipos ágiles 
  y multifuncionales, centrado en ofrecer experiencias de usuario de alta calidad.

# Experience
experience:
  - role: Senior Android Developer
    time: 2018-Present
    company: DHIS2
    details: |
      - Colaboré con los equipos de Producto, UX/UI y QA para entregar más de 15 funcionalidades por versión. <br>
      - Establecí CI/CD usando Jenkins y GitHub Actions, reduciendo el tiempo de despliegue de 2 horas a 35 minutos y habilitando pruebas automatizadas en todas las pull requests. <br>
      - Implementé estrategias de pruebas que incluye tests unitarios, de integración y de interfaz (screenshot), alcanzando una cobertura de código superior al 85%. <br>
    technologies_used: | 
      Kotlin, Jetpack Compose, Coroutines, Flows, RxJava, Dagger, Koin, Espresso, CI/CD


  - role: Android Developer
    time: 2017-Present
    company: Quadram | Mobile Solutions
    details: |
      - Desarrollé aplicaciones Android utilizando Clean Architecture, Kotlin y Jetpack Compose, logrando ciclos de desarrollo un 30% más rápidos. <br>
