      - Mentoricé a desarrolladores junior, brindando orientación en buenas prácticas y calidad de código. <br>
    technologies_used: | 
      Kotlin, Jetpack Compose, Coroutines, Flows, RxJava, Dagger, Koin, Espresso, CI/CD
  
  - role: Android Developer
